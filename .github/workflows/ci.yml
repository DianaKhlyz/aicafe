# CI: линт и тесты бэка, сборка фронта, контроль синхронности TS-типов
# с OpenAPI-схемой. Бесплатно в лимитах GitHub Actions.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Ловит «поменял Pydantic-модель, забыл перегенерировать типы фронта»
  types-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && uv sync --frozen
      - run: cd backend && uv run python scripts/export_openapi.py ../frontend/openapi.json
      - run: cd frontend && npx --yes openapi-typescript@7 openapi.json -o src/api/schema.d.ts && rm openapi.json
      - run: git diff --exit-code frontend/src/api/schema.d.ts
